name: school_control
description: الكنترول المدرسي - إدارة القيد ورصد الدرجات واستخراج النتائج
publish_to: 'none'
version: 2.2.1+7

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  archive: ^3.6.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/developer.png

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
